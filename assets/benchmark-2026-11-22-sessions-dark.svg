<svg xmlns="http://www.w3.org/2000/svg" width="840" height="424" viewBox="0 0 840 424" role="img" aria-labelledby="title desc">
<title id="title">Every session, not only the median: time against cost</title>
<desc id="desc">Scatter plot with one mark per session, nine in all. Across is the time for the whole job in seconds, up is the cost reported by the agent in dollars. Both scales start at zero. No Simplicio is hollow circles, Simplicio 3.14.0 is grey squares and Simplicio 3.15.0 is green diamonds. No Simplicio: 97 s and $0.0226, 121 s and $0.0280, 172 s and $0.0186. Simplicio 3.14.0: 90 s and $0.0214, 104 s and $0.0220, 106 s and $0.0249. Simplicio 3.15.0: 23 s and $0.0071, 25 s and $0.0098, 27 s and $0.0076.</desc>
