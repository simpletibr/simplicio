.w{stroke:#f0f6fc;stroke-width:2;fill:none}
.z{stroke:#30363d;stroke-width:1}
.ho{fill:#0d1117;stroke:#6e7681;stroke-width:3}
.gs{fill:#6e7681;stroke:#0d1117;stroke-width:2}
.as{fill:#0ca30c;stroke:#0d1117;stroke-width:2}
</style>
