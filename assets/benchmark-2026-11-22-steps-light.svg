<text class="v" x="327.61" y="112">53.7 s</text>
<path class="a" d="M214 130H221.41A4 4 0 0 1 225.41 134V146A4 4 0 0 1 221.41 150H214z"/>
<text class="vb" x="233.41" y="148">5.8 s</text>
<text class="t" x="416" y="38">2. Change</text>
<line class="z" x1="416" y1="50" x2="416" y2="158"/>
<path class="z" d="M416 166V160H534V166" fill="none"/>
<text class="k" x="416" y="184" text-anchor="middle">0</text>
<text class="k" x="534" y="184" text-anchor="middle">60 s</text>
<path class="g" d="M416 58H446.02A4 4 0 0 1 450.02 62V74A4 4 0 0 1 446.02 78H416z"/>
<text class="v" x="458.02" y="76">17.3 s</text>
<path class="g" d="M416 94H441.89A4 4 0 0 1 445.89 98V110A4 4 0 0 1 441.89 114H416z"/>
<text class="v" x="453.89" y="112">15.2 s</text>
<path class="a" d="M416 130H429.5A4 4 0 0 1 433.5 134V146A4 4 0 0 1 429.5 150H416z"/>
<text class="vb" x="441.5" y="148">8.9 s</text>
<text class="t" x="618" y="38">3. Register</text>
