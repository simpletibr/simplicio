<svg xmlns="http://www.w3.org/2000/svg" width="840" height="262" viewBox="0 0 840 262" role="img" aria-labelledby="title desc">
<title id="title">Time by step, median of 3 sessions, one scale for all three steps</title>
<desc id="desc">Three small panels side by side, one for each step of the job, on one shared scale from 0 to 60 seconds. Each bar is the median time of 3 sessions. Step 1. Build: No Simplicio 57.3 s, Simplicio 3.14.0 53.7 s, Simplicio 3.15.0 5.8 s. Step 2. Change: No Simplicio 17.3 s, Simplicio 3.14.0 15.2 s, Simplicio 3.15.0 8.9 s. Step 3. Register: No Simplicio 31.4 s, Simplicio 3.14.0 27.5 s, Simplicio 3.15.0 10.3 s.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#1f2328}
.t{font-size:22px;font-weight:600;fill:#59636e}
.n{font-size:22px}
.nb{font-size:22px;font-weight:700}
.v{font-size:22px;font-weight:600}
.vb{font-size:22px;font-weight:700}
.k{font-size:19px;fill:#59636e}
.m{font-size:19px;font-weight:400;fill:#59636e}
.mb{font-size:19px;font-weight:700}
.g{fill:#8c959f}
.a{fill:#008300}
.w{stroke:#1f2328;stroke-width:2;fill:none}
.z{stroke:#d1d9e0;stroke-width:1}
.ho{fill:#ffffff;stroke:#8c959f;stroke-width:3}
.gs{fill:#8c959f;stroke:#ffffff;stroke-width:2}
.as{fill:#008300;stroke:#ffffff;stroke-width:2}
</style>
<rect x="0.5" y="0.5" width="839" height="261" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text class="n" x="22" y="76">No Simplicio</text>
<text class="n" x="22" y="112">Simplicio 3.14.0</text>
<text class="nb" x="22" y="148">Simplicio 3.15.0</text>
<text class="t" x="214" y="38">1. Build</text>
<line class="z" x1="214" y1="50" x2="214" y2="158"/>
<path class="z" d="M214 166V160H332V166" fill="none"/>
<text class="k" x="214" y="184" text-anchor="middle">0</text>
<text class="k" x="332" y="184" text-anchor="middle">60 s</text>
<path class="g" d="M214 58H322.69A4 4 0 0 1 326.69 62V74A4 4 0 0 1 322.69 78H214z"/>
<text class="v" x="334.69" y="76">57.3 s</text>
