<svg xmlns="http://www.w3.org/2000/svg" width="840" height="486" viewBox="0 0 840 486" role="img" aria-labelledby="title desc">
<title id="title">Where Simplicio runs and what leaves your machine</title>
<desc id="desc">A large box labelled Your machine holds You, Your coding agent (Claude Code, Codex, Cursor, ...), Simplicio (one signed binary, started by your agent) and Your repository. You work with your coding agent. The agent talks to Simplicio over local STDIO (MCP), and Simplicio maps, reads, edits, checks your repository. Three dashed links leave the box. From your coding agent to Your model provider: prompts and code, as before. From Simplicio to SimpleTI: sign-in and plan check, no repository content. From Simplicio to GitHub: release check, no data about you or your code. As of Simplicio 3.15.0.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#f0f6fc}
.mt{font-size:22px;font-weight:600;fill:#9198a1}
.nt{font-size:19px;fill:#9198a1}
.bt{font-size:23px;font-weight:700}
.bs{font-size:19px;fill:#9198a1}
.st{font-size:26px;font-weight:700;fill:#0d1117}
.ss{font-size:19px;fill:#0d1117}
.lb{font-size:19px;fill:#9198a1}
.m{fill:#161b22;stroke:#6e7681;stroke-width:1.5}
.b{fill:#0d1117;stroke:#9198a1;stroke-width:1.5}
.o{fill:#0d1117;stroke:#6e7681;stroke-width:1.5}
.s{fill:#0ca30c}
.l{stroke:#9198a1;stroke-width:2.5;fill:none}
.lh{fill:#9198a1}
.x{stroke:#f0f6fc;stroke-width:2.5;stroke-dasharray:9 7;fill:none}
.xh{fill:#f0f6fc}
</style>
<rect x="0.5" y="0.5" width="839" height="485" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect class="m" x="16" y="16" width="808" height="288" rx="16"/>
<text class="mt" x="40" y="50" text-anchor="start">Your machine</text>
<text class="nt" x="800" y="50" text-anchor="end">As of Simplicio 3.15.0</text>
<rect class="b" x="134" y="62" width="120" height="50" rx="25"/>
<text class="bt" x="194" y="93.44" text-anchor="middle">You</text>
<rect class="b" x="525" y="62" width="230" height="50" rx="12"/>
<text class="bt" x="640" y="93.44" text-anchor="middle">Your repository</text>
<rect class="b" x="40" y="172" width="308" height="112" rx="12"/>
<text class="bt" x="194" y="220.44" text-anchor="middle">Your coding agent</text>
<text class="bs" text-anchor="middle"><tspan x="194" y="249.32">Claude Code, Codex, Cursor, ...</tspan></text>
<rect class="s" x="484" y="172" width="316" height="112" rx="12"/>
<text class="st" x="642" y="209.78" text-anchor="middle">Simplicio</text>
<text class="ss" text-anchor="middle"><tspan x="642" y="239.32">one signed binary,</tspan><tspan x="642" y="262.32">started by your agent</tspan></text>
<line class="l" x1="194" y1="112" x2="194" y2="160"/><polygon class="lh" points="194,172 201,159 187,159"/>
<line class="l" x1="348" y1="228" x2="472" y2="228"/><polygon class="lh" points="484,228 471,235 471,221"/>
<line class="l" x1="640" y1="172" x2="640" y2="124"/><polygon class="lh" points="640,112 633,125 647,125"/>
<text class="lb" text-anchor="middle"><tspan x="416" y="187">local STDIO</tspan><tspan x="416" y="210">(MCP)</tspan></text>
<text class="lb" text-anchor="end"><tspan x="626" y="148.5">maps, reads, edits, checks</tspan></text>
<rect class="o" x="40" y="380" width="308" height="90" rx="12"/>
<text class="bt" x="194" y="431.44" text-anchor="middle">Your model provider</text>
<line class="x" x1="194" y1="284" x2="194" y2="368"/><polygon class="xh" points="194,380 201,367 187,367"/>
<text class="lb" text-anchor="start"><tspan x="208" y="340">prompts and</tspan><tspan x="208" y="363">code, as before</tspan></text>
<rect class="o" x="396" y="380" width="222" height="90" rx="12"/>
<text class="bt" x="507" y="417.44" text-anchor="middle">SimpleTI</text>
<text class="bs" text-anchor="middle"><tspan x="507" y="446.32">no repository content</tspan></text>
<line class="x" x1="507" y1="284" x2="507" y2="368"/><polygon class="xh" points="507,380 514,367 500,367"/>
<text class="lb" text-anchor="end"><tspan x="493" y="340">sign-in and</tspan><tspan x="493" y="363">plan check</tspan></text>
<rect class="o" x="634" y="380" width="190" height="90" rx="12"/>
<text class="bt" x="729" y="405.94" text-anchor="middle">GitHub</text>
<text class="bs" text-anchor="middle"><tspan x="729" y="434.82">no data about you</tspan><tspan x="729" y="457.82">or your code</tspan></text>
<line class="x" x1="729" y1="284" x2="729" y2="368"/><polygon class="xh" points="729,380 736,367 722,367"/>
<text class="lb" text-anchor="end"><tspan x="715" y="340">release check</tspan></text>
</svg>
