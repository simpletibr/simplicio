<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-labelledby="title desc">
<title id="title">Peak memory: Simplicio uses more than the plain agent</title>
<desc id="desc">Peak memory, median of 3 sessions, with the lowest and highest session as a thin line. No Simplicio 270 MB, lowest to highest session 248 to 274 MB, the lowest of the three. Simplicio 3.14.0 436 MB, lowest to highest session 432 to 439 MB, 61% more than No Simplicio. Simplicio 3.15.0 375 MB, lowest to highest session 365 to 379 MB, 39% more than No Simplicio.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#f0f6fc}
.t{font-size:22px;font-weight:600;fill:#9198a1}
.n{font-size:22px}
.nb{font-size:22px;font-weight:700}
.v{font-size:22px;font-weight:600}
.vb{font-size:22px;font-weight:700}
.k{font-size:19px;fill:#9198a1}
.m{font-size:19px;font-weight:400;fill:#9198a1}
.mb{font-size:19px;font-weight:700}
.g{fill:#6e7681}
.a{fill:#0ca30c}
.w{stroke:#f0f6fc;stroke-width:2;fill:none}
.z{stroke:#30363d;stroke-width:1}
.ho{fill:#0d1117;stroke:#6e7681;stroke-width:3}
.gs{fill:#6e7681;stroke:#0d1117;stroke-width:2}
.as{fill:#0ca30c;stroke:#0d1117;stroke-width:2}
</style>
<rect x="0.5" y="0.5" width="839" height="149" rx="10" fill="#0d1117" stroke="#30363d"/>
<text class="t" x="22" y="38">Peak memory</text>
