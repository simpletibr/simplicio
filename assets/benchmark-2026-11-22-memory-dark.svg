<path class="g" d="M234 54H463.63A4 4 0 0 1 467.63 58V70A4 4 0 0 1 463.63 74H234z"/>
<path class="w" d="M448.62 64H471.4M448.62 59V69M471.4 59V69"/>
<text class="v" x="481.4" y="72">270 MB<tspan class="mb" dx="12">lowest</tspan></text>
<text class="n" x="22" y="100">Simplicio 3.14.0</text>
